<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CriptoOpciones Lab — Ajuste</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.0/plotly.min.js"></script>
<script src="co_shared.js"></script>
<style id="shared-css"></style>
<style>
.ajuste-grid{display:grid;grid-template-columns:340px 1fr;gap:0;flex:1;overflow:hidden}
.ajuste-form{background:#111120;border-right:1px solid #1e2035;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.ajuste-result{padding:16px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:10px;color:#334155;text-transform:uppercase;letter-spacing:0.8px}
.field input,.field select{height:30px;font-size:12px}
.result-card{background:#13131f;border:1px solid #1e2035;border-radius:8px;padding:12px}
.result-card h3{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#475569;margin-bottom:10px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1e2035;font-size:12px}
.result-row:last-child{border:none}
.result-row .rl{color:#64748b}
.result-row .rv{font-weight:600}
.roll-option{background:#0d0d14;border:1px solid #1e2035;border-radius:6px;padding:10px;cursor:pointer;transition:all 0.15s}
.roll-option:hover{border-color:#38bdf8}
.roll-option.selected{border-color:#38bdf8;background:#0c1422}
.roll-option .ro-title{font-size:12px;font-weight:600;color:#38bdf8;margin-bottom:4px}
.roll-option .ro-desc{font-size:10px;color:#475569}
.roll-option .ro-cost{font-size:14px;font-weight:700;margin-top:6px}
</style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="ajuste-grid">
<div class="ajuste-form">
  <div class="section-title">Posición actual</div>

  <div id="bot-pos-section" style="display:none;margin-bottom:10px">
    <label style="font-size:10px;color:#334155;text-transform:uppercase;letter-spacing:.8px">Posición del bot</label>
    <select id="bot-pos-select" onchange="loadFromBot()"
      style="width:100%;height:30px;margin-top:4px;font-size:12px;background:#0d1117;border:1px solid #38bdf8;border-radius:4px;color:#38bdf8">
      <option value="">-- Selecciona posición --</option>
    </select>
    <div id="bot-pos-badge" style="font-size:10px;color:#10b981;margin-top:4px"></div>
    <div style="height:1px;background:#1e2035;margin:10px 0"></div>
  </div>

  <div class="field"><label>Estrategia</label>
    <select id="strat-type" onchange="calcAjuste()">
      <option value="call_spread">Call Spread</option>
      <option value="put_spread">Put Spread</option>
      <option value="iron_condor">Iron Condor</option>
      <option value="naked_call">Naked Call</option>
      <option value="naked_put">Naked Put</option>
    </select>
  </div>

  <div class="field"><label>Precio entrada (spot)</label>
    <input type="number" id="s-entry" value="77000" step="100" oninput="calcAjuste()">
  </div>
  <div class="field"><label>Strike corto (principal)</label>
    <input type="number" id="s-short" value="79000" step="50" oninput="calcAjuste()">
  </div>
  <div class="field"><label>Strike largo (protección)</label>
    <input type="number" id="s-long" value="82000" step="50" oninput="calcAjuste()">
  </div>
  <div class="field"><label>Prima cobrada/pagada ($)</label>
    <input type="number" id="prima-orig" value="500" step="10" oninput="calcAjuste()">
  </div>
  <div class="field"><label>DTE restante</label>
    <input type="number" id="dte-rest" value="4" min="0" max="90" oninput="calcAjuste()">
  </div>
  <div class="field"><label>IV actual (%)</label>
    <input type="number" id="iv-adj" value="45" min="1" max="300" oninput="calcAjuste()">
  </div>
  <div class="field"><label>Precio spot actual</label>
    <input type="number" id="spot-now" value="77000" step="100" oninput="calcAjuste()">
  </div>
  <div class="field"><label>Cantidad de contratos</label>
    <input type="number" id="qty-adj" value="0.7" step="0.1" oninput="calcAjuste()">
  </div>

  <div class="section-title" style="margin-top:8px">Nuevo vencimiento para roll</div>
  <div class="field"><label>DTE del nuevo vencimiento</label>
    <input type="number" id="dte-new" value="14" min="1" max="90" oninput="calcAjuste()">
  </div>
  <div class="field"><label>IV esperada en nuevo vencimiento (%)</label>
    <input type="number" id="iv-new" value="45" min="1" max="300" oninput="calcAjuste()">
  </div>

  <button class="btn primary" style="width:100%;height:34px" onclick="calcAjuste()">Calcular opciones de ajuste</button>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
    <button class="btn" style="height:30px;font-size:11px" onclick="loadFromBot()">🤖 Bot</button>
    <button class="btn" style="height:30px;font-size:11px" onclick="loadFromState()">📂 Analizador</button>
  </div>
</div>

<div class="ajuste-result">
  <div class="result-card">
    <h3>Estado actual de la posición</h3>
    <div class="result-row"><span class="rl">PnL no realizado</span><span class="rv" id="r-pnl">$--</span></div>
    <div class="result-row"><span class="rl">% del máximo</span><span class="rv" id="r-pct">--%</span></div>
    <div class="result-row"><span class="rl">Delta actual</span><span class="rv" id="r-delta">--</span></div>
    <div class="result-row"><span class="rl">Theta diario restante</span><span class="rv" id="r-theta">$--/día</span></div>
    <div class="result-row"><span class="rl">Prob. de éxito restante</span><span class="rv" id="r-pop">--%</span></div>
    <div class="result-row"><span class="rl">Break-even</span><span class="rv" id="r-be">$--</span></div>
  </div>

  <div class="result-card">
    <h3>Recomendación</h3>
    <div id="r-rec" style="font-size:12px;color:#38bdf8;padding:6px 0">--</div>
  </div>

  <div class="result-card">
    <h3>Opciones de ajuste (Roll)</h3>
    <div id="roll-options" style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:11px;color:#334155">Calculando...</div>
    </div>
  </div>

  <div class="result-card">
    <h3>Comparativa: mantener vs ajustar</h3>
    <div id="compare-chart" style="height:200px"></div>
  </div>
</div>
</div>

<script>
document.getElementById('shared-css').textContent=CO_CSS;
document.getElementById('nav-placeholder').innerHTML=navHTML('ajuste.html');

const DARK={template:'plotly_dark',paper_bgcolor:'transparent',plot_bgcolor:'transparent',margin:{l:50,r:10,t:10,b:35},font:{family:'Segoe UI,system-ui',size:10}};

function loadFromState(){
  const legs=COState.legs;
  if(!legs||!legs.length){alert('No hay patas en el analizador. Ve al Analizador y crea una estrategia primero.');return;}
  document.getElementById('spot-now').value=COState.spot;
  document.getElementById('iv-adj').value=COState.iv;
  document.getElementById('dte-rest').value=COState.dte;
  const sells=legs.filter(l=>l.accion==='sell');
  if(sells.length>0){
    document.getElementById('s-short').value=sells[0].strike;
    document.getElementById('prima-orig').value=sells.reduce((s,l)=>s+l.prima*l.qty,0).toFixed(2);
  }
  calcAjuste();
}

function calcAjuste(){
  const S=+document.getElementById('spot-now').value||77000;
  const Kshort=+document.getElementById('s-short').value||79000;
  const Klong=+document.getElementById('s-long').value||82000;
  const primaOrig=+document.getElementById('prima-orig').value||500;
  const dte=+document.getElementById('dte-rest').value||4;
  const iv=+document.getElementById('iv-adj').value/100||0.45;
  const qty=+document.getElementById('qty-adj').value||0.7;
  const dteNew=+document.getElementById('dte-new').value||14;
  const ivNew=+document.getElementById('iv-new').value/100||0.45;
  const rfr=COState.rfr;
  const T=dte/365,Tnew=dteNew/365;
  const tipo='call'; // simplificado

  // Valor actual de la posición
  const gShort=bs(S,Kshort,T,rfr,iv,tipo);
  const gLong=bs(S,Klong,T,rfr,iv,tipo);
  // Calcular PnL con patas reales si disponibles
  let pnlActual, deltaNeto, thetaNeto;
  if(_botLegs.length>=2){
    pnlActual=_botLegs.reduce((sum,l)=>{
      const g=bs(S,l.strike,T,rfr,l.iv||iv,l.is_call?'call':'put');
      return sum+(l.side==='sell'?(l.avg_price-g.precio):(g.precio-l.avg_price))*l.size;
    },0);
    deltaNeto=_botLegs.reduce((sum,l)=>{
      const g=bs(S,l.strike,T,rfr,l.iv||iv,l.is_call?'call':'put');
      return sum+(l.side==='sell'?-g.delta:g.delta)*l.size;
    },0);
    thetaNeto=_botLegs.reduce((sum,l)=>{
      const g=bs(S,l.strike,T,rfr,l.iv||iv,l.is_call?'call':'put');
      return sum+(l.side==='sell'?-g.theta:g.theta)*l.size;
    },0);
  }else{
    const valorActual=gShort.precio-gLong.precio;
    pnlActual=(primaOrig-valorActual)*qty;
    deltaNeto=(gShort.delta-gLong.delta)*qty;
    thetaNeto=(gShort.theta-gLong.theta)*qty;
  }

  // PoP restante
  const mu=Math.log(S)+(rfr-0.5*iv*iv)*T;
  const sig=iv*Math.sqrt(T);
  const popActual=(1-normCDF((Math.log(Kshort)-mu)/sig))*100;

  // BE aproximado
  const be=Kshort-primaOrig/qty/100;

  // Actualizar métricas
  // Mostrar PnL real de Bybit si disponible
  const pnlDisplay=(_botRealPnl!==null)?_botRealPnl:pnlActual;
  const pnlEl=document.getElementById('r-pnl');
  pnlEl.textContent=fmt(pnlDisplay)+(_botRealPnl!==null?' ✓':' ~');
  pnlEl.className='rv '+(pnlDisplay>=0?'pos':'neg');
  document.getElementById('r-pct').textContent=((pnlActual/primaOrig)*100).toFixed(1)+'%';
  document.getElementById('r-delta').textContent=deltaNeto.toFixed(3);
  document.getElementById('r-theta').textContent=fmt(thetaNeto)+'/día';
  document.getElementById('r-pop').textContent=popActual.toFixed(1)+'%';
  document.getElementById('r-be').textContent='$'+be.toLocaleString('es',{maximumFractionDigits:0});

  // Recomendación
  let rec='';
  if(pnlActual>=primaOrig*0.5)rec='✅ Considera cerrar la posición. Has capturado más del 50% del crédito máximo.';
  else if(pnlActual<=-primaOrig*0.5)rec='⚠️ La posición está en pérdida significativa. Evalúa un roll o cierre para limitar daños.';
  else if(dte<=2)rec='⏰ DTE muy bajo. Considera cerrar para evitar riesgo de vencimiento.';
  else if(popActual<30)rec='🔴 PoP baja (<30%). El precio está cerca del strike corto. Considera roll defensivo.';
  else rec='🟡 Posición activa dentro de parámetros normales. Continúa monitoreando.';
  document.getElementById('r-rec').textContent=rec;

  // Opciones de roll
  const rollOpts=[];

  // Roll hacia afuera (mismo strike, más DTE)
  const gShortNew=bs(S,Kshort,Tnew,rfr,ivNew,tipo);
  const gLongNew=bs(S,Klong,Tnew,rfr,ivNew,tipo);
  const creditoNuevo=gShortNew.precio-gLongNew.precio;
  const costoRollOut=(valorActual-creditoNuevo)*qty*100;
  rollOpts.push({titulo:'Roll hacia afuera (mismo strike)',desc:`Cerrar posición actual y reabrir en DTE ${dteNew}`,costo:costoRollOut,tipo:costoRollOut>0?'neg':'pos'});

  // Roll hacia arriba (strike más alto, mismo DTE)
  const KshortUp=Math.round((Kshort+S)*0.5/50)*50;
  const gShortUp=bs(S,KshortUp,T,rfr,iv,tipo);
  const gLongUp=bs(S,KshortUp+(Klong-Kshort),T,rfr,iv,tipo);
  const creditoUp=gShortUp.precio-gLongUp.precio;
  const costoRollUp=(valorActual-creditoUp)*qty*100;
  rollOpts.push({titulo:'Roll hacia arriba (strike más alto)',desc:`Mover strike corto a $${KshortUp.toLocaleString()} (mismo DTE)`,costo:costoRollUp,tipo:costoRollUp>0?'neg':'pos'});

  // Roll diagonal (strike más alto + más DTE)
  const gShortDiag=bs(S,KshortUp,Tnew,rfr,ivNew,tipo);
  const gLongDiag=bs(S,KshortUp+(Klong-Kshort),Tnew,rfr,ivNew,tipo);
  const creditoDiag=gShortDiag.precio-gLongDiag.precio;
  const costoRollDiag=(valorActual-creditoDiag)*qty*100;
  rollOpts.push({titulo:'Roll diagonal (strike alto + más DTE)',desc:`Strike a $${KshortUp.toLocaleString()} en DTE ${dteNew}`,costo:costoRollDiag,tipo:costoRollDiag>0?'neg':'pos'});

  // Cerrar ahora
  rollOpts.push({titulo:'Cerrar posición ahora',desc:`Capturar ${fmt(pnlActual)} de ganancia/pérdida`,costo:-pnlActual,tipo:pnlActual>=0?'pos':'neg'});

  document.getElementById('roll-options').innerHTML=rollOpts.map((o,i)=>`
    <div class="roll-option" onclick="this.classList.toggle('selected')">
      <div class="ro-title">${o.titulo}</div>
      <div class="ro-desc">${o.desc}</div>
      <div class="ro-cost ${o.tipo}">${o.costo>0?'Costo: '+fmt(o.costo):'Crédito: '+fmt(-o.costo)}</div>
    </div>`).join('');

  // Gráfica comparativa
  const dtes2=Array.from({length:dte+1},(_,i)=>i);
  const pnlMantener=dtes2.map(d=>{
    if(d===0)return pnlActual;
    const Td=d/365;
    const gS=bs(S,Kshort,Td,rfr,iv,tipo);
    const gL=bs(S,Klong,Td,rfr,iv,tipo);
    return(primaOrig-(gS.precio-gL.precio))*qty*100;
  });
  const pnlRoll=dtes2.map(d=>{
    const Td=(dteNew-d)/365;
    const gS=bs(S,KshortUp,Td,rfr,ivNew,tipo);
    const gL=bs(S,KshortUp+(Klong-Kshort),Td,rfr,ivNew,tipo);
    return(creditoNuevo-(gS.precio-gL.precio))*qty*100+pnlActual;
  });

  Plotly.react('compare-chart',[
    {x:dtes2,y:pnlMantener,mode:'lines',name:'Mantener',line:{color:'#38bdf8',width:2}},
    {x:dtes2,y:pnlRoll,mode:'lines',name:'Roll out',line:{color:'#22c55e',width:2,dash:'dot'}},
  ],{...DARK,xaxis:{title:'Días hasta vencimiento',gridcolor:'#1e2035'},yaxis:{title:'PnL ($)',tickformat:'$,.2f',gridcolor:'#1e2035'},shapes:[{type:'line',x0:0,x1:dte,y0:0,y1:0,line:{color:'#1e2035',width:1}}],legend:{font:{size:9}}},{responsive:true,displayModeBar:false});
}

// ── Bot config ────────────────────────────────────────────────────────────
const BOT_CONFIG={
  get url(){return localStorage.getItem('co_bot_url')||localStorage.getItem('bot_url')||''},
  get token(){return localStorage.getItem('co_bot_token')||localStorage.getItem('bot_token')||''},
};
async function botFetch(path,opts={}){
  if(!BOT_CONFIG.url||!BOT_CONFIG.token)throw new Error('Bot no configurado');
  const r=await fetch(BOT_CONFIG.url+path,{
    ...opts,
    headers:{'X-Bot-Token':BOT_CONFIG.token,'Content-Type':'application/json',...(opts.headers||{})}
  });
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

// ── Estado de patas reales ────────────────────────────────────────────────
let botPositions=[];
let _botLegs=[];
let _botRealPnl=null;

async function loadBotPositions(){
  const section=document.getElementById('bot-pos-section');
  const badge=document.getElementById('bot-pos-badge');
  try{
    if(!BOT_CONFIG.url||!BOT_CONFIG.token){
      if(section){
        section.style.display='block';
        if(badge)badge.innerHTML='⚠️ Bot no configurado — ve a <b>Posiciones</b> y configura la URL y token del bot';
      }
      return;
    }
    if(badge)badge.textContent='Conectando al bot...';
    if(section)section.style.display='block';
    const data=await botFetch('/live');
    botPositions=data.estrategias||[];
    if(!botPositions.length){
      if(badge)badge.innerHTML='<span style="color:#f59e0b">⚠️ Sin posiciones abiertas en el bot</span>';
      return;
    }
    const sel=document.getElementById('bot-pos-select');
    if(!sel)return;
    sel.innerHTML='<option value="">-- Selecciona posición --</option>'+
      botPositions.map((p,i)=>`<option value="${i}">${p.estrategia} ${p.asset} | ${p.expiry} | PnL:${p.pnl>=0?'+':''}$${Math.abs(p.pnl).toFixed(2)}</option>`).join('');
    if(badge)badge.textContent='';
    // Auto-seleccionar si hay una sola posición
    if(botPositions.length===1){sel.value='0';loadFromBot();}
  }catch(e){
    if(section)section.style.display='block';
    if(badge)badge.innerHTML=`<span style="color:#f43f5e">❌ Error bot: ${e.message}</span>`;
    console.log('Bot error:',e);
  }
}

function loadFromBot(){
  const idx=document.getElementById('bot-pos-select').value;
  if(idx==='')return;
  const pos=botPositions[parseInt(idx)];
  if(!pos)return;
  const legs=pos.legs||[];
  const sells=legs.filter(l=>l.side==='sell');
  const buys=legs.filter(l=>l.side==='buy');

  // Estrategia
  let stratType='iron_condor';
  if(pos.estrategia==='CS')stratType=sells.some(l=>l.is_put)?'put_spread':'call_spread';
  else if(pos.estrategia==='DS')stratType=buys.some(l=>l.is_call)?'call_spread':'put_spread';
  else if(pos.estrategia==='CAL')stratType='call_spread';
  document.getElementById('strat-type').value=stratType;

  // Strikes — short call más relevante
  const shortCall=sells.find(l=>l.is_call);
  const longCall=buys.find(l=>l.is_call);
  const shortPut=sells.find(l=>l.is_put);
  if(shortCall)document.getElementById('s-short').value=shortCall.strike;
  if(longCall)document.getElementById('s-long').value=longCall.strike;

  // Crédito neto
  document.getElementById('prima-orig').value=(pos.credito_entrada||0).toFixed(2);

  // DTE
  const months={JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
  let dte=16;
  try{
    const e=pos.expiry;
    if(/^\d{2}[A-Z]{3}\d{2}$/.test(e)){
      const d=+e.substring(0,2),m=months[e.substring(2,5)],y=2000+(+e.substring(5,7));
      dte=Math.max(0,Math.round((new Date(y,m,d)-Date.now())/86400000));
    }
  }catch{}
  document.getElementById('dte-rest').value=dte;

  // IV promedio
  const ivAvg=sells.length>0?sells.reduce((s,l)=>s+(l.iv||50),0)/sells.length:50;
  document.getElementById('iv-adj').value=ivAvg.toFixed(1);

  // Spot y qty
  document.getElementById('spot-now').value=COState.spot||2500;
  document.getElementById('s-entry').value=COState.spot||2500;
  document.getElementById('qty-adj').value=legs.length>0?legs[0].size:0.1;

  // Guardar patas reales y PnL real
  _botRealPnl=pos.pnl;
  _botLegs=legs.map(l=>({
    strike:l.strike, side:l.side,
    is_call:l.is_call, is_put:l.is_put,
    avg_price:l.avg_price||l.mark_price||0,
    size:l.size||0.1, iv:(l.iv||50)/100,
  }));

  document.getElementById('bot-pos-badge').innerHTML=
    `✅ Cargado: <b style="color:${pos.pnl>=0?'#10b981':'#f43f5e'}">${pos.pnl>=0?'+':''}$${pos.pnl.toFixed(2)}</b> | ${pos.estrategia} ${pos.asset} | ${legs.length} patas`;

  calcAjuste();
}

async function navRefresh(){
  try{
    const ex=COState.exchange||'Bybit';
    // Fetch BTC y ETH en paralelo
    const [btc,eth]=await Promise.all([
      fetchSpot(ex,'BTC'),
      fetchSpot(ex,'ETH'),
    ]);

    // Actualizar nav-price con BTC naranja + ETH azul
    const navP=document.getElementById('nav-price');
    if(navP){
      navP.innerHTML=
        `<span style="color:#f7931a;font-weight:700">BTC $${btc?btc.toLocaleString('es',{maximumFractionDigits:0}):'--'}</span>`+
        `<span style="color:#334155;margin:0 4px">|</span>`+
        `<span style="color:#8b9cf7;font-weight:700">ETH $${eth?eth.toLocaleString('es',{maximumFractionDigits:0}):'--'}</span>`;
      navP.style.minWidth='220px';
    }

    // Guardar spot del activo actual
    const act=COState.activo||'ETH';
    const spot=act==='BTC'?btc:eth;
    if(spot){
      COState.spot=spot;
      const sf=document.getElementById('spot-now');
      if(sf&&(sf.value=='77000'||sf.value=='2500'))sf.value=spot;
    }

    // Exchange label
    const navEx=document.getElementById('nav-exchange');
    if(navEx)navEx.textContent=ex;

    // IVR
    try{
      const data=await botFetch('/live');
      const ivrVal=data.greeks?.[act];
      const navIvr=document.getElementById('nav-ivr');
      if(navIvr)navIvr.textContent=ivrVal?'IVR --':'IVR --';
    }catch{}

  }catch(e){console.log('navRefresh:',e.message);}
}
// Fix nav active
(function(){
  const cur=location.pathname.split('/').pop()||'index.html';
  document.querySelectorAll('.nav-link').forEach(a=>{
    a.classList.toggle('active',a.getAttribute('href')===cur);
  });
})();

window.addEventListener('load',async()=>{
  // Nav active link
  (function(){
    const cur=location.pathname.split('/').pop()||'index.html';
    document.querySelectorAll('.nav-link').forEach(a=>{
      a.classList.toggle('active',a.getAttribute('href')===cur);
    });
  })();

  document.getElementById('spot-now').value=COState.spot||2500;
  document.getElementById('iv-adj').value=COState.iv||45;
  calcAjuste();
  // Actualizar nav con precios reales
  navRefresh();
  // Cargar posiciones del bot
  await loadBotPositions();
  // Refresh automático cada 60s
  setInterval(navRefresh, 60000);
});
