name: Terminal safety

on:
  pull_request:
  push:
    branches:
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject merge markers and missing local scripts
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              "index.html", "positions.html", "chain.html", "iv.html",
              "ajuste.html", "diario.html", "manual.html",
          ]
          for name in pages:
              text = Path(name).read_text(encoding="utf-8")
              assert not re.search(
                  r"^(<<<<<<<|=======|>>>>>>>)",
                  text,
                  flags=re.MULTILINE,
              ), f"merge marker in {name}"
              for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', text):
                  if src.startswith(("http://", "https://", "//", "data:")):
                      continue
                  assert Path(src.split("?", 1)[0]).is_file(), (
                      f"{name}: missing local script {src}"
                  )
          print("HTML_REFERENCES_OK")
      - name: Enforce Deribit-only linear-USDC runtime
        shell: python
        run: |
          from pathlib import Path

          runtime = [
              "exchange_engine.js", "iv_engine.js", "market_engine.js",
              "co_shared.js", "co_bot.js", "index.html", "positions.html",
              "chain.html", "iv.html", "ajuste.html", "diario.html", "manual.html",
          ]
          violations = []
          for name in runtime:
              text = Path(name).read_text(encoding="utf-8").lower()
              for token in ("bybit", "/v5/", "api.bybit.com", "stream.bybit.com"):
                  if token in text:
                      violations.append(f"{name}:{token}")
          assert not violations, violations

          engine = Path("exchange_engine.js").read_text(encoding="utf-8")
          assert "const EXCHANGES=['Deribit'];" in engine
          assert "currency=USDC&kind=option" in engine
          assert "_USDC-" in engine
          assert "version:'3.0-deribit-only'" in engine

          analyzer = Path("index.html").read_text(encoding="utf-8")
          assert "DERIBIT_NATIVE_COMBO" in analyzer
          assert "Fill-or-Kill" in analyzer
          print("DERIBIT_ONLY_TERMINAL_OK")
      - name: Parse inline JavaScript
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");
          const pages = [
            "index.html", "positions.html", "chain.html", "iv.html",
            "ajuste.html", "diario.html", "manual.html",
          ];
          let inlineCount = 0;
          for (const page of pages) {
            const html = fs.readFileSync(page, "utf8");
            const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
            for (const [i, match] of scripts.entries()) {
              new vm.Script(match[1], { filename: `${page}-inline-${i + 1}.js` });
              inlineCount += 1;
            }
          }
          console.log(`TERMINAL_JS_SYNTAX_OK ${inlineCount}`);
          for (const file of fs.readdirSync(".").filter(name => name.endsWith(".js"))) {
            new vm.Script(fs.readFileSync(file, "utf8"), { filename: file });
          }
          console.log("LOCAL_JS_SYNTAX_OK");
          NODE
      - name: Guard rolled diagonal valuation
        shell: python
        run: |
          from pathlib import Path
          text = Path("positions.html").read_text(encoding="utf-8")
          checks = {
              "per-leg tenor": "const legT=Math.max(Number.isFinite(legDte)?legDte:dte,0.001)/365;" in text,
              "per-leg IV": "const legIv=legIvDecimal(l,iv);" in text,
              "back residual IV": "const backIv=legIvDecimal(long,iv);" in text,
              "manual-roll basis warning": "p.basis_adjusted===false" in text,
              "safe incomplete pair": "homogeneousPair?.short&&homogeneousPair?.long" in text,
          }
          failed = [name for name, ok in checks.items() if not ok]
          assert not failed, failed
          print("ROLLED_DIAGONAL_VALUATION_OK")
