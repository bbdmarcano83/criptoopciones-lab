name: Materialize terminal migration file

on:
  push:
    branches:
      - migration-local-institutional-20260828
    paths:
      - scripts/migration_payload.py

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-local-institutional-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and verify exact source file
        run: python scripts/migration_payload.py
      - name: Commit exact file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TARGET=$(python scripts/migration_payload.py --print-target)
          git add -- "$TARGET"
          if git diff --cached --quiet; then
            echo "No file change to commit"
            exit 0
          fi
          git commit -m "migration: materialize exact $TARGET [skip ci]"
          git push origin HEAD:migration-local-institutional-20260828
