name: Materialize audited terminal candidates

on:
  push:
    branches:
      - migration-local-institutional-20260828
    paths:
      - scripts/materialize_audit_candidates.py
      - scripts/audit_payload/**

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration-local-institutional-20260828
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize and verify candidates
        run: python scripts/materialize_audit_candidates.py
      - name: Commit audited candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- manual.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "migration: materialize audited manual and analyzer [skip ci]"
          git push origin HEAD:migration-local-institutional-20260828
